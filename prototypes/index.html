    threshold: c?c.threshold:null, value: c?c.value:null, trend: c?c.trend:null,
    posText: list.length>1 ? `${T("start")} ${Tf("nodePos", i+1, list.length)}` : ""};
  cascadeDlg();
}

function cascadeDlg(){
  const d = S.dlg; if(!d) return;
  const isAct = d.purpose==="reaction";
  const tmeta = objTypeMeta(d.type);
  const itemLab = isAct ? (d.item?actLab(d.item):"") : (d.item?evLab(d.item):"");
  const itemKind = isAct ? "act" : "event";
  const itemEmpty = isAct ? T("reactionKind") : T("pickEvent");
  let body = `<div class="cascade">
    <div class="helper">${esc(T("cascadeHint"))}</div>
    <div class="stack" style="gap:4px"><span class="label">${esc(T("objType"))}</span>
      ${cbxBtn("type","dlg","", objTypeName(d.type), "", T("objType"))}</div>`;
  if(!tmeta.noObject){
    body += isAct
      ? objPicker(T("objects"), T("targetsHint"))
      : objPicker(T("sources"), T("sourcesHint"));
  }
  body += `<div class="stack" style="gap:4px"><span class="label">${esc(isAct?T("reactionKind"):T("eventKind"))}</span>
      ${cbxBtn(itemKind,"dlg","", itemLab, itemEmpty, isAct?T("reactionKind"):T("eventKind"))}</div>
  </div>`;
  const extras = isAct ? dlgActExtras(d) : dlgCondExtras(d);
  if(extras) body += `<div class="sec" style="margin-top:12px"><div class="sec-h">${esc(T("params"))}</div>${extras}</div>`;
  const title = d.mode==="edit"
    ? (isAct?T("editReaction"):T("editStart"))
    : (isAct?T("reactions"):T("setStart"));
  const errs = Object.values(dlgErrors(d));
  const blocked = !d.item || errs.length>0;
  openDlg(`<div class="dlg-h">${esc(title)}${d.posText?` <span class="muted" style="font:var(--one-type-body-sm)">· ${esc(d.posText)}</span>`:""}</div>
    <div class="dlg-b">${body}</div>
    <div class="dlg-f">
      ${errs.length?`<span class="err" style="margin:0 auto 0 0">${icon("alert")}<span>${esc(T("errFix"))}</span></span>`:""}
      <button class="btn btn-outline" data-act="closeDlg">${esc(T("cancel"))}</button>
      <button class="btn btn-primary" data-act="applyCascade" ${blocked?`aria-disabled="true" title="${esc(T("errFix"))}"`:""}>${esc(d.mode==="edit"?T("apply"):T("add"))}</button>
    </div>`);
}

function condExtrasFrom(d, c){
  const spec = evSpec(d.item);
  delete c.threshold; delete c.value; delete c.trend;
  if(spec.extra==="threshold") c.threshold = d.threshold==null ? 10 : d.threshold;
  if(spec.extra==="stat"){ c.value = d.value==null ? 80 : d.value; c.trend = d.trend || "up"; }
}

function applyCondDlg(){
  const m = cur(), d = S.dlg; if(!m || !d) return;
  remember();
  const devices = (d.objects||[]).slice();
  if(d.mode==="edit"){
    const c = condById(d.condId);
    if(c){ c.type=d.type; c.event=d.item; c.devices=devices; condExtrasFrom(d, c); S.node="cond:"+c.id; }
  } else {
    const c = {id:uid(), type:d.type, event:d.item, devices};
    condExtrasFrom(d, c);
    if(d.waitId){
      const a = findAct(d.waitId);
      if(a){ a.waitEvents = a.waitEvents||[]; a.waitEvents.push(c); }
    } else {
      m.conditions = m.conditions||[];
      m.conditions.push(c);
    }
    S.node = "cond:"+c.id;
  }
  closeDlg();
  S.dirty = snap()!==S.saved[m.id];
  render();
}

function applyActDlg(){
  const m = cur(), d = S.dlg; if(!m || !d) return;
  const a = findAct(d.actId); if(!a){ closeDlg(); return; }
  remember();
  replaceActKind(a, d.item);
  Object.assign(a.params, d.params||{});
  if(!objTypeMeta(actTypeOf(a)).noObject){
    const objs = (d.objects||[]).length ? d.objects : ["initiator"];
    setTargets(a, objs);
  }
  S.node = a.id;
  closeDlg();
  S.dirty = snap()!==S.saved[m.id];
  render();
}

function confirmDelNode(){
  const m = cur(); if(!m) return;
  const sel = selection(m);
  if(sel.kind!=="cond" && sel.kind!=="act") return;
  const isCond = sel.kind==="cond";
  const what = isCond ? condText(sel.cond) : actText(sel.act).title;
  openDlg(`<div class="dlg-h">${esc(isCond?T("delCondTitle"):T("delActTitle"))}</div>
    <div class="dlg-b">
      <div class="node" style="cursor:default;margin-bottom:8px">
        <div class="node-k">${esc(isCond?T("start"):T("reactionKind"))}</div>
        <div class="node-t">${esc(what)}</div>
      </div>
      ${esc(isCond?T("delCondBody"):T("delActBody"))}
    </div>
    <div class="dlg-f">
      <button class="btn btn-outline" data-act="closeDlg">${esc(T("cancel"))}</button>
      <button class="btn btn-danger" data-act="doDelNode">${esc(T("del"))}</button>
    </div>`);
}

function confirmLeave(nextId){
  const m = cur();
  S.pending = nextId;
  openDlg(`<div class="dlg-h">${esc(T("leaveTitle"))}</div>
    <div class="dlg-b">${esc(Tf("leaveBody", macroName(m)))}</div>
    <div class="dlg-f" style="justify-content:space-between">
      <button class="btn btn-danger" data-act="leave">${esc(T("leave"))}</button>
      <span class="row">
        <button class="btn btn-outline" data-act="closeDlg">${esc(T("stay"))}</button>
        <button class="btn btn-primary" data-act="saveThen">${esc(T("save"))}</button>
      </span>
    </div>`);
}

function confirmDel(){
  const m = cur();
  openDlg(`<div class="dlg-h">${esc(T("delTitle"))}</div>
    <div class="dlg-b">${esc(Tf("delBody", macroName(m)))}</div>
    <div class="dlg-f">
      <button class="btn btn-outline" data-act="closeDlg">${esc(T("cancel"))}</button>
      <button class="btn btn-danger" data-act="doDel">${esc(T("del"))}</button>
    </div>`);
}

function selectMacro(id, force){
  if(S.selId===id) return;
  if(S.dirty && !force){ confirmLeave(id); return; }
  S.selId = id; S.node=firstNode(S.macros.find(x=>x.id===id)); S.dirty=false;
  S.hist=[snap()]; S.histI=0;
  S.saved[id] = S.saved[id] ?? snap();
  hideMenu(); closeDlg(); render();
}

function createMacro(type){
  const n = S.macros.filter(m=>m.type===type).length+1;
  const m = {
    id: uid(), type,
    name: TR.defaultName[0]+" "+n, nameEn: TR.defaultName[1]+" "+n,
    mode:"always", inMenu:false, conditions:[], actions:[]
  };
  if(type==="cycle") m.heartbeat="01:00:00";
  S.macros.unshift(m);
  S.saved[m.id]=snap(m);
  selectMacro(m.id, true);
  if(type==="event" || type==="auto") eventDlg();
}

function addPickedAct(kind, objects, extra){
  const m = cur(); if(!m) return;
  remember();
  const spec = ACTS.find(x=>x.id===kind);
  let params = Object.assign({}, extra||{});
  if(spec && !objTypeMeta(spec.type).noObject){
    const arr = (objects||[]).length ? objects.slice() : ["initiator"];
    params.objects = arr;
  }
  const act = mkAct(kind, params);
  const ins = S.insert || {branch:"root", after:""};
  let list = m.actions;
  if(ins.branch.endsWith("-then")){
    const id = ins.branch.replace(/-then$/,"");
    const w = findAct(id); if(w) list = w.then;
  } else if(ins.branch.endsWith("-else")){
    const id = ins.branch.replace(/-else$/,"");
    const w = findAct(id); if(w) list = w.else;
  }
  const after = (ins.after||"").includes("|head") ? "" : ins.after;
  insertAct(list, after, act);
  S.node = act.id;
  closeDlg();
  S.dirty = snap()!==S.saved[m.id];
  render();
}

/* ── events ─────────────────────────────────────────────── */
document.addEventListener("click", ev=>{
  if(S.cbx && !ev.target.closest("#cbxpop") && !ev.target.closest("[data-act=cbxOpen]")) closeCbx();
  const t = ev.target.closest("[data-act]");
  if(!t){
    if(!ev.target.closest("#menu")) hideMenu();
    return;
  }
  const act = t.dataset.act;
  const m = cur();
  if(t.getAttribute("aria-disabled")==="true") return;   // kept hoverable so the reason stays readable

  if(act==="cbxOpen"){ openCbx(t); return; }
  if(act==="cbxPick"){ applyCbx(t.dataset.v); return; }
  if(act==="cbxRetry"){ if(S.cbx){ S.cbx.failed=false; S.cbx.loading=false; paintCbx(false); } return; }
  if(act==="applyCascade"){
    const d = S.dlg; if(!d || !d.item) return;
    if(d.purpose!=="reaction") applyCondDlg();
    else if(d.mode==="edit") applyActDlg();
    else addPickedAct(d.item, d.objects, d.params);
    return;
  }
  if(act==="rmPick"){
    if(!ev.target.closest(".chip-x")) return;   // only the cross itself removes a chip
    togglePick(t.dataset.dev); cascadeDlg(); return;
  }

  if(act==="nav" && t.dataset.k!=="navMacros"){
    openDlg(`<div class="dlg-h">${esc(T(t.dataset.k))}</div><div class="dlg-b">${esc(T("otherTab"))}</div>
      <div class="dlg-f"><button class="btn btn-primary" data-act="closeDlg">${esc(T("close"))}</button></div>`);
    return;
  }
  if(act==="theme"){
    S.theme = S.theme==="light"?"dark":"light";
    localStorage.setItem("macros-theme", S.theme); render(); return;
  }
  if(act==="flow"){ S.flow=t.dataset.v; localStorage.setItem("macros-flow", S.flow); render(); return; }
  if(act==="resetQ"){ S.q=""; S.type="all"; render(); return; }
  if(act==="createMenu"){ createMenu(ev.clientX, ev.clientY); return; }
  if(act==="create"){ hideMenu(); createMacro(t.dataset.type); return; }
  if(act==="sel"){ selectMacro(t.dataset.id); return; }
  if(act==="closeDlg"){ closeDlg(); S.pending=null; return; }
  if(act==="node"){ S.node=t.dataset.id; render(); return; }
  if(act==="addSlot"){
    S.insert={branch:t.dataset.branch||"root", after:t.dataset.after||""};
    catalogDlg(); return;
  }
  if(act==="pickAct"){ addPickedAct(t.dataset.kind); return; }
  if(act==="copy" && m){
    const c = clone(m); c.id=uid();
    c.name = m.name + TR.copySuffix[0];
    c.nameEn = (m.nameEn||m.name) + TR.copySuffix[1];
    walkActs(c.actions, a=>{ a.id=uid(); });
    (c.conditions||[]).forEach(x=>x.id=uid());
    S.macros.unshift(c); S.saved[c.id]=snap(c); selectMacro(c.id,true); return;
  }
  if(act==="editNode" && m){
    const sel = selection(m);
    if(sel.kind==="cond") eventDlg(sel.cond.id);
    else if(sel.kind==="act") actDlg(sel.act.id);
    else if(m.type!=="cycle") eventDlg();
    return;
  }
  if(act==="moveNode" && m){ moveNode(+t.dataset.v); return; }
  if(act==="dupNode" && m){ duplicateNode(); return; }
  if(act==="undo"){ restoreHist(S.histI-1); return; }
  if(act==="redo"){ restoreHist(S.histI+1); return; }
  if(act==="delNode" && m){ confirmDelNode(); return; }
  if(act==="doDelNode" && m){
    const sel = selection(m);
    closeDlg();
    const back = snap(m);                      // exact state to restore from the toast
    if(sel.kind==="cond"){
      remember();
      const id = sel.cond.id;
      m.conditions = (m.conditions||[]).filter(c=>c.id!==id);
      walkActs(m.actions, a=>{ if(a.waitEvents) a.waitEvents = a.waitEvents.filter(c=>c.id!==id); });
      S.node = firstNode(m);
    } else if(sel.kind==="act"){
      removeAct(sel.act.id);
      S.node = firstNode(m);
    }
    S.dirty = snap()!==S.saved[m.id];
    render();
    toast(T("deletedNode"), T("undoBtn"), ()=>{
      const cm = cur(); if(!cm) return;
      remember();
      Object.assign(cm, JSON.parse(back));
      S.dirty = snap()!==S.saved[cm.id];
      S.node = firstNode(cm);
      render();
    });
    return;
  }
  if(act==="del" && m){ confirmDel(); return; }
  if(act==="doDel" && m){
    S.macros = S.macros.filter(x=>x.id!==m.id);
    delete S.saved[m.id];
    S.dirty=false; S.selId = S.macros[0]?S.macros[0].id:null; S.node=firstNode(cur());
    closeDlg(); render(); return;
  }
  if(act==="save" && m){ S.saved[m.id]=snap(m); S.dirty=false; render(); toast(T("savedToast")); return; }
  if(act==="revert" && m){
    Object.assign(m, JSON.parse(S.saved[m.id]));
    S.dirty=false; S.node=firstNode(m); render(); return;
  }
  if(act==="leave"){
    const id=S.pending; const curm=cur();
    if(curm) Object.assign(curm, JSON.parse(S.saved[curm.id]));
    S.dirty=false; closeDlg(); selectMacro(id,true); return;
  }
  if(act==="saveThen"){
    if(m) S.saved[m.id]=snap(m);
    S.dirty=false; const id=S.pending; closeDlg(); selectMacro(id,true); return;
  }
  if(act==="addCond" && m){ eventDlg(); return; }
  if(act==="groupSame" && m){
    remember();
    const out=[], map={};
    m.conditions.forEach(c=>{
      const k=c.event+"|"+(c.threshold||"")+"|"+(c.value||"")+"|"+(c.trend||"");
      if(!map[k]){ map[k]={...c, devices:[...(c.devices||[])]}; out.push(map[k]); }
      else map[k].devices=[...new Set([...map[k].devices, ...(c.devices||[])])];
    });
    m.conditions=out;
    if(!selectedCond()) S.node=firstNode(m);
    S.dirty=true; render(); return;
  }
  if(act==="addWaitEv"){ eventDlg("", t.dataset.id); return; }
});

document.addEventListener("change", ev=>{
  const t = ev.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act;
  if(act==="lang"){ S.lang=t.value; localStorage.setItem("macros-lang", S.lang); render(); return; }
  if(act==="typeSel"){ S.type=t.value; render(); return; }
  if(act==="dp"){                               // parameter of the node being edited
    if(!S.dlg) return;
    S.dlg.params = S.dlg.params || {};
    const key = t.dataset.loc ? pkey(t.dataset.k) : t.dataset.k;
    S.dlg.params[key] = t.type==="checkbox" ? t.checked : t.value;
    cascadeDlg(); return;
  }
  if(act==="dc"){                               // extra of the condition being edited
    if(!S.dlg) return;
    S.dlg[t.dataset.k] = t.type==="number" ? +t.value : t.value;
    cascadeDlg(); return;
  }
  const m=cur(); if(!m) return;
  if(act==="np"){                               // parameter of the selected action, edited inline
    const a = findAct(S.node); if(!a) return;
    remember(); a.params = a.params||{};
    a.params[t.dataset.loc ? pkey(t.dataset.k) : t.dataset.k] = t.type==="checkbox" ? t.checked : t.value;
    S.dirty = snap()!==S.saved[m.id]; render(); return;
  }
  if(act==="nc"){                               // extra of the selected condition, edited inline
    const c = selectedCond(); if(!c) return;
    remember();
    c[t.dataset.k] = t.type==="number" ? +t.value : t.value;
    S.dirty = snap()!==S.saved[m.id]; render(); return;
  }
  if(act==="q"){ S.q=t.value; render(); return; }

  const patch = ()=>{ remember(); S.dirty = snap()!==S.saved[m.id]; };

  if(act==="mode"){ patch(); m.mode=t.value; if(m.mode==="schedule" && !m.scheduleId) m.scheduleId="sch_after"; render(); return; }
  if(act==="schedule"){ patch(); m.scheduleId=t.value; render(); return; }
  if(act==="inMenu"){ patch(); m.inMenu=t.checked; render(); return; }
  if(act==="heartbeat"){ patch(); m.heartbeat=t.value; render(); return; }
  if(act==="random"){ patch(); m.random=t.checked; render(); return; }
  if(act==="rename"){ setMacroName(m, t.value); S.dirty = snap()!==S.saved[m.id];
    document.querySelectorAll(".mrow[aria-selected='true'] .ttl").forEach(el=>el.textContent=macroName(m));
    const sum=document.querySelector(".summary"); if(sum) sum.innerHTML=summaryHtml(m);
    return; }
});

/* ── tooltips: full lists behind "and N more" ───────────── */
let tipTimer = null;
function hideTip(){
  clearTimeout(tipTimer);
  const tip=document.getElementById("tip");
  if(tip){ tip.hidden=true; tip.innerHTML=""; }
}
function hideTipSoon(){ clearTimeout(tipTimer); tipTimer=setTimeout(hideTip, 1000); }
function showTip(el){
  const data = S.tips[el.dataset.tip]; if(!data) return;
  const tip = document.getElementById("tip"); if(!tip) return;
  clearTimeout(tipTimer);
  const secs = data.sections || [{title:data.title, items:data.items}];
  tip.innerHTML = secs.map(s=>
    `<div class="tip-h">${esc(s.title)}</div>${s.items.map(x=>`<div class="tip-i">${esc(x)}</div>`).join("")}`
  ).join('<div class="tip-sep"></div>');
  tip.hidden = false;
  tip.scrollTop = 0;
  const r = el.getBoundingClientRect();
  const box = tip.getBoundingClientRect();
  let left = r.left, top = r.bottom + 6;
  if(left + box.width > innerWidth - 8) left = Math.max(8, innerWidth - box.width - 8);
  if(top + box.height > innerHeight - 8) top = Math.max(8, r.top - box.height - 6);
  tip.style.left = left+"px";
  tip.style.top = top+"px";
}
document.addEventListener("mouseover", ev=>{
  if(!ev.target.closest) return;
  const el = ev.target.closest("[data-tip]");
  if(el){ showTip(el); return; }
  if(ev.target.closest("#tip")) clearTimeout(tipTimer);
});
document.addEventListener("mouseout", ev=>{
  if(!ev.target.closest) return;
  if(ev.target.closest("[data-tip]") || ev.target.closest("#tip")) hideTipSoon();
});
/* WCAG 1.4.13: the same content must open on focus and close on Escape */
document.addEventListener("focusin", ev=>{
  const el = ev.target.closest && ev.target.closest("[data-tip]");
  if(el) showTip(el); else if(!(ev.target.closest && ev.target.closest("#tip"))) hideTipSoon();
});
document.addEventListener("focusout", ev=>{
  if(ev.target.closest && ev.target.closest("[data-tip]")) hideTipSoon();
});

document.addEventListener("input", ev=>{
  const tq=ev.target.closest("[data-act=q]");
  if(tq){ S.q=tq.value;
    const pos=tq.selectionStart;
    renderSide();
    const nq=document.querySelector("[data-act=q]");
    if(nq){ nq.focus(); nq.setSelectionRange(pos,pos); }
    return;
  }
  const cq=ev.target.closest("[data-act=cbxQ]");
  if(cq && S.cbx){
    S.cbx.q = cq.value;
    S.cbx.hi = 0;
    paintCbx(true);
  }
});

function condById(id){
  const m=cur(); if(!m) return null;
  let c = (m.conditions||[]).find(x=>x.id===id);
  if(c) return c;
  walkActs(m.actions, a=>{
    (a.waitEvents||[]).forEach(w=>{ if(w.id===id) c=w; });
  });
  return c;
}

document.addEventListener("keydown", ev=>{
  if(S.cbx){
    if(ev.key==="Escape"){ ev.preventDefault(); closeCbx(); return; }
    if(ev.key==="ArrowDown"){ ev.preventDefault(); S.cbx.hi++; paintCbx(true); return; }
    if(ev.key==="ArrowUp"){ ev.preventDefault(); S.cbx.hi=Math.max(0, S.cbx.hi-1); paintCbx(true); return; }
    if(ev.key==="Enter"){
      ev.preventDefault();
      const opts=cbxOpts();
      if(opts[S.cbx.hi]) applyCbx(opts[S.cbx.hi].id);
      return;
    }
  } else {
    const openEl = ev.target.closest && ev.target.closest("[data-act=cbxOpen]");
    if(openEl && (ev.key==="Enter" || ev.key===" " || ev.key==="ArrowDown")){
      ev.preventDefault();
      openCbx(openEl);
      return;
    }
  }
  const sp = ev.target.classList && ev.target.classList.contains("splitter") ? ev.target : null;
  if(sp && (ev.key==="ArrowLeft" || ev.key==="ArrowRight")){
    ev.preventDefault();
    const k = (ev.key==="ArrowLeft" ? -1 : 1) * (ev.shiftKey ? 48 : 16);
    const which = sp.dataset.split;
    setPanel(which, (which==="side"?S.sideW:S.inspW) + (which==="side"?k:-k));
    return;
  }
  if(sp && (ev.key==="Home" || ev.key==="Enter")){
    ev.preventDefault(); setPanel(sp.dataset.split, PANEL[sp.dataset.split].def); return;
  }
  if(ev.key==="Escape"){
    const tip = document.getElementById("tip");
    if(tip && !tip.hidden){ hideTip(); return; }
    if(S.cbx){ closeCbx(); return; }
    hideMenu(); closeDlg(); return;
  }
  if(ev.altKey && (ev.key==="ArrowUp" || ev.key==="ArrowDown")){
    ev.preventDefault(); moveNode(ev.key==="ArrowUp" ? -1 : 1); return;
  }
  const row = ev.target.closest && ev.target.closest(".mrow");
  if(row && (ev.key==="ArrowDown" || ev.key==="ArrowUp" || ev.key==="Home" || ev.key==="End")){
    ev.preventDefault();
    const rows = [...document.querySelectorAll(".mrow")];
    const i = rows.indexOf(row);
    const next = ev.key==="Home" ? 0 : ev.key==="End" ? rows.length-1
      : Math.min(rows.length-1, Math.max(0, i + (ev.key==="ArrowDown"?1:-1)));
    if(rows[next]) rows[next].focus();
    return;
  }
  if((ev.ctrlKey||ev.metaKey) && ev.key==="s"){ ev.preventDefault(); const m=cur(); if(m&&S.dirty){ S.saved[m.id]=snap(m); S.dirty=false; render(); } }
  if((ev.ctrlKey||ev.metaKey) && ev.key==="z"){ ev.preventDefault(); restoreHist(S.histI-1); }
  if((ev.ctrlKey||ev.metaKey) && (ev.key==="y" || (ev.shiftKey && ev.key==="z"))){ ev.preventDefault(); restoreHist(S.histI+1); }
});

function clampPanel(which, w){
  const p = PANEL[which], other = which==="side" ? S.inspW : S.sideW;
  return Math.round(Math.max(p.min, Math.min(w, p.max,
    Math.max(p.min, innerWidth - other - MAIN_MIN - 14))));
}
function setPanel(which, w){
  const v = clampPanel(which, w);
  if(which==="side") S.sideW = v; else S.inspW = v;
  const el = document.getElementById(which==="side"?"side":"insp");
  if(el) el.style.width = v+"px";
  const sp = document.querySelector(`.splitter[data-split="${which}"]`);
  if(sp){
    sp.setAttribute("aria-valuenow", v);
    sp.setAttribute("aria-label", which==="side"?T("resizeSideAria"):T("resizeInspAria"));
    sp.setAttribute("title", T("resizeTitle"));
  }
  return v;
}
function applyPanels(){
  setPanel("side", S.sideW);
  setPanel("insp", S.inspW);
}
document.addEventListener("mousedown", ev=>{
  const sp = ev.target.closest(".splitter"); if(!sp || ev.button!==0) return;
  ev.preventDefault();
  S.rs = { which:sp.dataset.split, x0:ev.clientX, w0:sp.dataset.split==="side"?S.sideW:S.inspW };
  sp.classList.add("splitter--drag");
  document.body.dataset.resizing = "1";
});
document.addEventListener("mousemove", ev=>{
  if(!S.rs) return;
  const dx = ev.clientX - S.rs.x0;
  setPanel(S.rs.which, S.rs.w0 + (S.rs.which==="side"?dx:-dx));
});
document.addEventListener("mouseup", ()=>{
  if(!S.rs) return;
  S.rs = null; delete document.body.dataset.resizing;
  document.querySelectorAll(".splitter--drag").forEach(e=>e.classList.remove("splitter--drag"));
});
document.addEventListener("dblclick", ev=>{
  const sp = ev.target.closest(".splitter"); if(!sp) return;
  setPanel(sp.dataset.split, PANEL[sp.dataset.split].def);
});
addEventListener("resize", ()=> applyPanels());

document.getElementById("dlg").addEventListener("click", ev=>{
  if(ev.target===ev.currentTarget) closeDlg();
});

addEventListener("beforeunload", ev=>{
  if(!S.dirty) return;
  ev.preventDefault();          // browser shows its own "leave site?" prompt
  ev.returnValue = T("leaveTab");
  return ev.returnValue;
});

S.macros = seed();
S.macros.forEach(m=> S.saved[m.id]=snap(m));
S.selId = "m_auto_motion";
S.node = firstNode(cur());
S.hist=[snap()]; S.histI=0;
S.theme = localStorage.getItem("macros-theme") || "light";
